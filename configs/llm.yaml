# LLM profiles. Every command takes --llm <profile>; `default` is used otherwise.
# API keys come from the environment variable named in api_key_env, never from this file.
default: nim-mistral

profiles:
  # Hosted open-weight models on NVIDIA's free API (build.nvidia.com), nothing runs locally.
  # Free tier is ~40 requests/minute; the backend spaces requests. Replies take a median 25 s but
  # up to 850 s, and a request can stall with no reply: each attempt times out after 300 s and the
  # same request is retried (backoff 5..60 s) for up to 2 h, so a slow API delays a task, not skips it.
  # Hosted providers may not honour seed, so runs are not guaranteed reproducible.
  # Probed 2026-11-02 with this account: kimi-k2.6 and nemotron-3-super return 404; glm-5.3-flash,
  # deepseek-v4.1-flash, gemma-4-31b and gpt-oss-20b timed out (90 s). Both models below always
  # reason (reasoning_effort/enable_thinking are rejected or ignored); reasoning tokens are reported.
  nim-mistral:
    # Mistral Large 4 (1T total, 52B active), Mistral Ecosystem Open-Weight License (modified MIT).
    backend: openai_compat
    model: mistralai/mistral-large-4-1t-a52b
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    requests_per_minute: 30
    max_retries: 0      # the backend retries itself, within max_wait_s
    timeout_s: 300
    max_wait_s: 7200    # wait up to 2 h for a stalled request before failing the task
    options: {temperature: 0, seed: 7, max_tokens: 4096}

  nim-minimax:
    backend: openai_compat
    model: minimaxai/minimax-m3.1-flash
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    requests_per_minute: 30
    max_retries: 0      # the backend retries itself, within max_wait_s
    timeout_s: 300
    max_wait_s: 7200    # wait up to 2 h for a stalled request before failing the task
    options: {temperature: 0, seed: 7, max_tokens: 4096}

  ollama-qwen3:
    backend: ollama
    model: qwen3:8b
    host: http://localhost:11434
    options: {temperature: 0, seed: 7, num_ctx: 32768, think: false}

  # Same model through Ollama's OpenAI-compatible endpoint. num_ctx and think cannot be
  # set here; reasoning_effort "none" is Ollama's /v1 way to turn thinking off.
  ollama-qwen3-v1:
    backend: openai_compat
    model: qwen3:8b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY   # unused by local Ollama; falls back to a placeholder
    options: {temperature: 0, seed: 7, extra: {reasoning_effort: none}}

  claude-opus:
    backend: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    # No temperature/seed on current Claude models; effort controls thinking depth.
    options: {max_tokens: 16000, effort: medium}

  scripted:
    backend: scripted
    model: scripted
